<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pipeline Icon with Chain Link Design -->
  <rect width="220" height="80" fill="none"/>
  
  <!-- Chain Link Elements - Pipeline Styled -->
  <circle cx="40" cy="40" r="16" fill="#2A628F" stroke="#3E92CC" stroke-width="2"/>
  <circle cx="80" cy="40" r="16" fill="#2A628F" stroke="#3E92CC" stroke-width="2"/>
  <circle cx="120" cy="40" r="16" fill="#2A628F" stroke="#3E92CC" stroke-width="2"/>
  
  <!-- Connecting Lines to represent Pipeline -->
  <path d="M56 40H64" stroke="#3E92CC" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 40H104" stroke="#3E92CC" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Application Name -->
  <text x="145" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2A628F">Pipeline</text>
  <text x="145" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2A628F">Scheduler</text>
</svg>
